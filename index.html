<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine</title>

<style>
body{
    margin:0;
    background: url(https://github.dev/surajmagar135/unique/blob/main/code/ram.jpeg) no-repeat center center; /* <-- background image */
    background-size: cover;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
    user-select:none;
}

/* Hearts */
.heart{
    position:fixed;
    bottom:-20px;
    font-size:20px;
    animation: floatUp linear infinite;
    opacity:0.7;
}

@keyframes floatUp{
    to{ transform:translateY(-110vh); }
}

/* Card */
.card{
    background:white;
    padding:30px 20px;
    border-radius:15px;
    text-align:center;
    position:relative;
    width:90%;
    max-width:350px;
    height:280px;
    overflow:hidden;
}

/* Buttons */
button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition: transform 0.2s;
}

#yes{
    background:#ff4d6d;
    color:white;
    animation:pulse 1.5s infinite;
    position:absolute;
    left:20px;
    top:160px;
}

@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.1)}
    100%{transform:scale(1)}
}

#no{
    background:gray;
    color:white;
    position:absolute;
    left:220px;
    top:160px;
}

#hurray{display:none;font-size:26px;color:#ff0055;margin-top:15px;}
#final-msg{display:none;font-size:22px;color:#ff0055;margin-top:5px;}
#smirk{position:absolute;font-size:22px;display:none;}
#kiss{position:absolute;top:15px;right:15px;font-size:24px;display:none;}
</style>
</head>

<body>

<div class="card" id="card">
    <h2>Will you be my Valentine ❤️</h2>

    <button id="yes">Yes</button>
    <button id="no">No</button>

    <span id="smirk">😢</span>
    <span id="kiss">😘❤️</span>

    <div id="hurray">🎉 HURRAY!!! 🎉</div>
    <div id="final-msg">I knew it 😘</div>

    <h3 class="title">Hello Pyari!</h3>
    <p id="currentTime"></p>
</div>

<!-- Free online Howler library for sounds -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>

<script>
/* 🎵 ONLINE LIGHT SOUNDS */
const happySound = new Howl({
  src: ['https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg'],
  volume:0.5
});
const sadClickSound = new Howl({
  src: ['https://actions.google.com/sounds/v1/cartoon/slide_whistle_down.ogg'],
  volume:0.5
});

/* ---------- ELEMENTS ---------- */
const yesBtn=document.getElementById("yes");
const noBtn=document.getElementById("no");
const card=document.getElementById("card");
const smirk=document.getElementById("smirk");
const kiss=document.getElementById("kiss");

/* ---------- VIBRATION ---------- */
function vibrate(ms){ if(navigator.vibrate) navigator.vibrate(ms); }

/* ---------- YES CLICK ---------- */
yesBtn.onclick=()=>{
    vibrate(120);
    yesBtn.style.transform="scale(1.2)";
    setTimeout(()=>yesBtn.style.transform="scale(1)",200);

    happySound.play();

    document.getElementById("hurray").style.display="block";
    document.getElementById("final-msg").style.display="block";
    noBtn.style.display="none";
    smirk.style.display="none";
    kiss.style.display="block";
};

/* ---------- NO HOVER (run away + vibration, no sound) ---------- */
function moveNo(){
    vibrate(80);

    const yesRect = yesBtn.getBoundingClientRect();

    let x,y,overlap;
    do{
        x = Math.random() * (card.clientWidth - noBtn.offsetWidth);
        y = Math.random() * (card.clientHeight - noBtn.offsetHeight - 40) + 40;

        x = Math.max(0, Math.min(x, card.clientWidth - noBtn.offsetWidth));
        y = Math.max(40, Math.min(y, card.clientHeight - noBtn.offsetHeight));

        noBtn.style.left = x + "px";
        noBtn.style.top  = y + "px";

        const n=noBtn.getBoundingClientRect();
        overlap = !(
            n.right < yesRect.left ||
            n.left  > yesRect.right ||
            n.bottom< yesRect.top  ||
            n.top   > yesRect.bottom
        );
    }while(overlap);

    smirk.style.display="block";
    smirk.style.left=(x+40)+"px";
    smirk.style.top=y+"px";
}

noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart",(e)=>{ e.preventDefault(); moveNo(); });

/* NO click → light sad sound + vibration */
noBtn.addEventListener("click", ()=>{
    sadClickSound.play();
    vibrate(150);
});

/* ---------- Hearts floating ---------- */
setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(3+Math.random()*4)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),7000);
},500);

/* ---------- Time display ---------- */
function updateTime(){
    document.getElementById("currentTime").innerText = new Date().toLocaleTimeString();
}
setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
